<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Michigeeks - Comprobante digital</title>

<link rel="stylesheet" href="../assets/css/bootstrap.css">
<link rel="stylesheet" href="../assets/css/maquina.css">
<link rel="icon" href="../assets/img/logo_office.svg" type="image/x-icon">

<style>
  /* Al imprimir/guardar como PDF: quitamos nav, botones, y forzamos
     colores claros para no gastar tinta con fondos oscuros. */
  @media print {
    header, .no-imprimir { display: none !important; }
    body { background: white !important; }
    .card { box-shadow: none !important; border: 1px solid #ccc !important; }
    .card-body { background: white !important; }
    #bandaEstado { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .text-cyan, .text-secondary, .form-label { color: #333 !important; }
    .form-control { background: white !important; color: #111 !important; border-color: #ccc !important; }
  }
</style>
</head>

<body>
<script>window.SITE_ROOT = "../";</script>
<script src="../assets/js/header.js"></script>

<div class="container py-5" style="max-width:560px;" id="comprobante">

  <div class="card border-0 shadow-lg overflow-hidden">

    <!-- Banda de estado: mismo color para ambos productos, logo dinámico -->
    <div class="p-4 text-center text-white" id="bandaEstado"
         style="background: linear-gradient(135deg, var(--bs-primary), var(--bs-pink));">
      <div class="mb-3">
        <div class="d-inline-flex align-items-center justify-content-center bg-white rounded-circle"
             style="width:64px; height:64px;">
          <img id="logoProducto" src="" alt="" style="max-width:38px; max-height:38px;">
        </div>
      </div>
      <h1 class="h5 fw-bold mb-3" id="tituloProducto">Tu compra fue aprobada en Michigeeks</h1>
      <div class="d-flex justify-content-center gap-5 small">
        <div>
          <div class="text-uppercase opacity-75" style="font-size:.7rem;">Fecha</div>
          <div class="fw-semibold" id="diaTransaccion">—</div>
        </div>
        <div>
          <div class="text-uppercase opacity-75" style="font-size:.7rem;">Hora (CDMX)</div>
          <div class="fw-semibold" id="horaTransaccion">—</div>
        </div>
      </div>
    </div>

    <!-- Cuerpo del comprobante -->
    <div class="card-body bg-dark p-4 p-md-5">

      <div class="text-center mb-4">
        <div class="text-secondary text-uppercase small mb-1">Monto</div>
        <div class="display-6 fw-bold text-cyan" id="monto">—</div>
      </div>

      <div class="mb-3">
        <label class="form-label text-secondary small">Correo electrónico</label>
        <div class="input-group">
          <input type="text" class="form-control" id="correo" readonly>
          <button class="btn btn-outline-info" type="button" onclick="copiarCampo('correo', this)">Copiar</button>
        </div>
      </div>

      <div class="mb-4" id="grupoContrasena">
        <label class="form-label text-secondary small">Contraseña temporal</label>
        <div class="input-group">
          <input type="text" class="form-control" id="contrasena" readonly>
          <button class="btn btn-outline-info" type="button" onclick="copiarCampo('contrasena', this)">Copiar</button>
        </div>
      </div>

      <!-- Datos del cliente -->
      <div class="row text-center border-top border-secondary-subtle pt-4 mb-3">
        <div class="col-6">
          <div class="text-secondary text-uppercase small mb-1">Teléfono</div>
          <div class="fw-semibold" id="telefonoCliente">—</div>
        </div>
        <div class="col-6">
          <div class="text-secondary text-uppercase small mb-1">N.º de pedido</div>
          <div class="fw-semibold" id="numeroPedido">—</div>
        </div>
      </div>

      <!-- Expiración y duración -->
      <div class="row text-center border-top border-secondary-subtle pt-4">
        <div class="col-6">
          <div class="text-secondary text-uppercase small mb-1">Expira</div>
          <div class="fw-semibold" id="fechaExpiracion">—</div>
        </div>
        <div class="col-6">
          <div class="text-secondary text-uppercase small mb-1">Duración</div>
          <div class="fw-semibold" id="duracionMeses">—</div>
        </div>
      </div>

      <!-- Lugar, en su propia fila -->
      <div class="row text-center border-top border-secondary-subtle pt-4 mt-1">
        <div class="col-12">
          <div class="text-secondary text-uppercase small mb-1">Lugar</div>
          <div class="fw-semibold" id="lugar" style="font-size:0.85rem;">—</div>
        </div>
      </div>

      <!-- Soporte -->
      <div class="mt-4 pt-4 border-top border-secondary-subtle no-imprimir">
        <div class="text-secondary text-uppercase small mb-2 text-center">¿Necesitas ayuda?</div>
        <div class="d-grid gap-2">
          <a id="btnWhatsapp" href="#" target="_blank" rel="noopener"
             class="btn btn-success d-flex align-items-center justify-content-center gap-2">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 2C6.48 2 2 6.36 2 11.75c0 2.02.65 3.9 1.76 5.46L2.5 21.5l4.5-1.18a10.3 10.3 0 0 0 5 1.28c5.52 0 10-4.36 10-9.75S17.52 2 12 2Zm0 17.7c-1.6 0-3.1-.44-4.38-1.2l-.31-.18-2.68.7.72-2.55-.2-.32A7.9 7.9 0 0 1 4.1 11.75C4.1 7.47 7.66 4 12 4s7.9 3.47 7.9 7.75-3.56 7.95-7.9 7.95Zm4.3-5.9c-.24-.12-1.4-.68-1.62-.76-.22-.08-.38-.12-.54.12-.16.24-.62.76-.76.92-.14.16-.28.18-.52.06-.24-.12-1-.36-1.9-1.15-.7-.6-1.18-1.35-1.32-1.58-.14-.24-.02-.37.1-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.54-1.28-.74-1.76-.2-.46-.4-.4-.54-.4h-.46c-.16 0-.42.06-.64.3-.22.24-.84.8-.84 1.96 0 1.16.86 2.28.98 2.44.12.16 1.7 2.56 4.12 3.6.58.24 1.03.39 1.38.5.58.18 1.1.15 1.52.09.46-.07 1.4-.57 1.6-1.12.2-.55.2-1.02.14-1.12-.06-.1-.22-.16-.46-.28Z"/>
            </svg>
            Soporte por WhatsApp
          </a>
          <a id="btnMessenger" href="#" target="_blank" rel="noopener"
             class="btn btn-primary d-flex align-items-center justify-content-center gap-2">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 2C6.48 2 2 6.24 2 11.5c0 2.98 1.44 5.63 3.7 7.37V22l3.38-1.86c.9.25 1.87.38 2.92.38 5.52 0 10-4.24 10-9.5S17.52 2 12 2Zm1.02 12.79-2.55-2.72-4.98 2.72 5.48-5.82 2.6 2.72 4.93-2.72-5.48 5.82Z"/>
            </svg>
            Soporte por Messenger
          </a>
        </div>
      </div>

      <!-- Imprimir / guardar como PDF -->
      <div class="mt-3 no-imprimir">
        <button class="btn btn-outline-secondary w-100" onclick="window.print()">
          Imprimir / Guardar como PDF
        </button>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/frases.js"></script>
<script src="../assets/js/typewriter.js"></script>

<script>

// Datos de contacto de soporte. Edita aquí si cambian.
const WHATSAPP_NUMERO = "525568942312"; // formato internacional sin '+' ni espacios
const MESSENGER_USUARIO = "michi.geeks.2025";

function decodeData(codigo) {
    let base64 = codigo.replace(/-/g, "+").replace(/_/g, "/");
    while (base64.length % 4) { base64 += "="; }
    const binary = atob(base64);
    const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
    const json = new TextDecoder().decode(bytes);
    return JSON.parse(json);
}

function formatFecha(fechaStr) {
    if (!fechaStr) { return "—"; }
    const [anio, mes, dia] = fechaStr.split("-").map(Number);
    const fecha = new Date(anio, mes - 1, dia);
    return fecha.toLocaleDateString("es-MX", {
        day: "numeric",
        month: "long",
        year: "numeric"
    });
}

function formatMonto(monto) {
    if (!monto) { return "—"; }
    const numero = Number(monto);
    if (Number.isNaN(numero)) { return monto; }
    return numero.toLocaleString("es-MX", { style: "currency", currency: "MXN" });
}

async function copiarCampo(id, boton) {
    const input = document.getElementById(id);
    await navigator.clipboard.writeText(input.value);
    const textoOriginal = boton.textContent;
    boton.textContent = "✓ Copiado";
    setTimeout(() => { boton.textContent = textoOriginal; }, 1500);
}

function cargarComprobante() {

    const params = new URLSearchParams(window.location.search);
    const codigo = params.get("d");

    if (!codigo) {
        document.getElementById("comprobante").innerHTML = `
            <div class="alert alert-danger">
                <h1 class="h5 mb-1">Enlace inválido</h1>
                <p class="mb-0">No se encontraron datos para mostrar.</p>
            </div>
        `;
        return;
    }

    try {
        const datos = decodeData(codigo);
        const esOffice = datos.producto === "Office 365";

        document.getElementById("tituloProducto").textContent =
            `Felicidades ${datos.nombreCliente || "cliente"}, por tu compra de ${datos.producto || "tu producto"} en Michigeeks.`;

        document.getElementById("logoProducto").src = esOffice
            ? "../assets/img/logo_office2.png"
            : "../assets/img/logo_canva.png";
        document.getElementById("logoProducto").alt = datos.producto || "Producto";

        document.getElementById("diaTransaccion").textContent = formatFecha(datos.diaTransaccion);
        document.getElementById("horaTransaccion").textContent = datos.horaTransaccion || "—";
        document.getElementById("monto").textContent = formatMonto(datos.monto);
        document.getElementById("correo").value = datos.correo || "—";

        if (esOffice) {
            document.getElementById("grupoContrasena").classList.remove("d-none");
            document.getElementById("contrasena").value = datos.contrasena || "—";
        } else {
            document.getElementById("grupoContrasena").remove();
        }

        document.getElementById("telefonoCliente").textContent = datos.telefonoCliente || "—";
        document.getElementById("numeroPedido").textContent = datos.numeroPedido || "—";

        document.getElementById("fechaExpiracion").textContent = formatFecha(datos.fechaExpiracion);
        document.getElementById("duracionMeses").textContent = datos.duracionMeses
            ? `${datos.duracionMeses} meses`
            : "—";

        document.getElementById("lugar").textContent = datos.lugar || "—";

        // Botón de WhatsApp con mensaje pre-armado, incluyendo el número de pedido
        const mensajeWhatsapp = `Hola Aaron! Quisiera soporte para mi compra de *${datos.producto || "mi pedido"}.* Realicé mi compra el día ${ formatFecha(datos.diaTransaccion)  || "N/A"}`;
        document.getElementById("btnWhatsapp").href =
            `https://wa.me/${WHATSAPP_NUMERO}?text=${encodeURIComponent(mensajeWhatsapp)}`;

        document.getElementById("btnMessenger").href = `https://m.me/${MESSENGER_USUARIO}`;

    } catch (error) {
        document.getElementById("comprobante").innerHTML = `
            <div class="alert alert-danger">
                <h1 class="h5 mb-1">Enlace inválido</h1>
                <p class="mb-0">No fue posible interpretar la información.</p>
            </div>
        `;
    }
}

cargarComprobante();

</script>

</body>
</html>
