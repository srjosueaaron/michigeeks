<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de enlaces</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,.08);
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .generar {
            background: #111;
            color: white;
        }

        .copiar {
            background: #e9e9e9;
            color: #111;
        }

        #resultado {
            margin-top: 20px;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 6px;
            word-break: break-all;
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Generador de enlace</h1>

    <label>Nombre</label>
    <input id="nombre" type="text" placeholder="Aaron">

    <label>Correo</label>
    <input id="correo" type="text" placeholder="aaron@gmail.com">

    <label>Producto</label>
    <input id="producto" type="text" placeholder="Microsoft 365">

    <label>Precio</label>
    <input id="precio" type="text" placeholder="$199 MXN">

    <label>Folio</label>
    <input id="folio" type="text" placeholder="MG-0001">

    <button class="generar" onclick="generarURL()">
        Generar enlace
    </button>

    <div id="resultado"></div>

    <button
        id="botonCopiar"
        class="copiar"
        onclick="copiarURL()"
        style="display:none;"
    >
        Copiar enlace
    </button>

</div>


<script>

let urlGenerada = "";

function encodeData(data) {

    const json = JSON.stringify(data);

    // Permite caracteres como ñ, á, é, etc.
    const bytes = new TextEncoder().encode(json);

    let binary = "";

    bytes.forEach(byte => {
        binary += String.fromCharCode(byte);
    });

    // Base64 URL Safe
    return btoa(binary)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");
}


function generarURL() {

    const datos = {
        nombre: document.getElementById("nombre").value,
        correo: document.getElementById("correo").value,
        producto: document.getElementById("producto").value,
        precio: document.getElementById("precio").value,
        folio: document.getElementById("folio").value
    };

    const codigo = encodeData(datos);

    /*
        Si generador.html y comprobante.html están
        en la misma carpeta, esto calcula la URL automáticamente.
    */

    const url = new URL("comprobante.html", window.location.href);

    url.searchParams.set("d", codigo);

    urlGenerada = url.href;

    const resultado = document.getElementById("resultado");

    resultado.textContent = urlGenerada;
    resultado.style.display = "block";

    document.getElementById("botonCopiar").style.display = "block";
}


async function copiarURL() {

    await navigator.clipboard.writeText(urlGenerada);

    const boton = document.getElementById("botonCopiar");

    boton.textContent = "✓ Enlace copiado";

    setTimeout(() => {
        boton.textContent = "Copiar enlace";
    }, 1500);
}

</script>

</body>
</html>
