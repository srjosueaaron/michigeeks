<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Michigeeks - Generador de comprobante</title>

<link rel="stylesheet" href="../assets/css/bootstrap.css">
<link rel="stylesheet" href="../assets/css/maquina.css">
<link rel="icon" href="../assets/img/logo_office.svg" type="image/x-icon">
</head>

<body>
<script>window.SITE_ROOT = "../";</script>
<script src="../assets/js/header.js"></script>

<div class="container py-5" style="max-width:780px;">
  <div class="card bg-dark border-secondary-subtle shadow-lg">
    <div class="card-body p-4 p-md-5">

      <h1 class="h3 fw-bold mb-4 text-cyan">Generador de comprobante</h1>

      <form onsubmit="return false;">

        <div class="row g-3">

          <div class="col-md-6">
            <label class="form-label" for="producto">Producto</label>
            <select id="producto" class="form-select" onchange="actualizarCamposProducto()">
              <option value="Office 365">Office 365</option>
              <option value="Canva">Canva</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label" for="lugar">Lugar de compra</label>
            <select id="lugar" class="form-select">
              <option value="CDMX">CDMX</option>
              <option value="Querétaro">Querétaro</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label" for="correo" id="labelCorreo">Correo electrónico generado</label>
            <input id="correo" type="text" class="form-control" placeholder="cuenta.michigeeks@outlook.com">
          </div>

          <div class="col-md-6" id="grupoContrasena">
            <label class="form-label" for="contrasena">Contraseña temporal</label>
            <input id="contrasena" type="text" class="form-control" placeholder="Temporal123">
          </div>

          <div class="col-md-6 d-none" id="grupoDuracion">
            <label class="form-label" for="duracion">Duración de la licencia (meses)</label>
            <select id="duracion" class="form-select" onchange="actualizarFechaExpiracion()">
              <option value="1">1 mes</option>
              <option value="3">3 meses</option>
              <option value="6">6 meses</option>
              <option value="12" selected>12 meses</option>
              <option value="24">24 meses</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label" for="telefonoCliente">Número telefónico del cliente</label>
            <input id="telefonoCliente" type="tel" class="form-control" placeholder="55 1234 5678">
          </div>

          <div class="col-md-6">
            <label class="form-label" for="numeroPedido">Número de pedido</label>
            <input id="numeroPedido" type="text" class="form-control" placeholder="MG-0001">
          </div>

          <div class="col-md-6">
            <label class="form-label" for="monto">Monto (MXN)</label>
            <input id="monto" type="number" step="0.01" class="form-control" placeholder="199">
          </div>

          <div class="col-md-6">
            <label class="form-label" for="diaTransaccion">Día de la transacción</label>
            <input id="diaTransaccion" type="date" class="form-control" onchange="actualizarFechaExpiracion()">
          </div>

          <div class="col-12">
            <label class="form-label">Fecha de expiración</label>
            <div class="form-control bg-transparent text-secondary" id="previsualizacionExpiracion">
              Selecciona el día de la transacción
            </div>
            <div class="form-text">
              Se calcula sola: +1 año para Office 365, o + la duración elegida para Canva.
            </div>
          </div>

        </div>

        <button type="button" class="btn btn-primary btn-lg w-100 mt-4" onclick="generarURL()">
          Generar enlace
        </button>

      </form>

      <div id="resultado" class="alert alert-secondary mt-4 d-none" style="word-break:break-all;"></div>

      <button id="botonCopiar" class="btn btn-outline-info w-100 mt-2 d-none" onclick="copiarURL()">
        Copiar enlace
      </button>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/frases.js"></script>
<script src="../assets/js/typewriter.js"></script>

<script>

let urlGenerada = "";
let fechaExpiracionCalculada = "";

function encodeData(data) {
    const json = JSON.stringify(data);
    const bytes = new TextEncoder().encode(json);
    let binary = "";
    bytes.forEach(byte => { binary += String.fromCharCode(byte); });
    return btoa(binary)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");
}

function obtenerHoraCDMX() {
    return new Intl.DateTimeFormat("es-MX", {
        timeZone: "America/Mexico_City",
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
    }).format(new Date());
}

// Locale "en-CA" da como resultado el formato ISO YYYY-MM-DD directo,
// que es justo lo que espera un <input type="date">.
function obtenerFechaHoyCDMX() {
    return new Intl.DateTimeFormat("en-CA", {
        timeZone: "America/Mexico_City"
    }).format(new Date());
}

// Muestra/oculta campos según el producto elegido y recalcula la expiración.
function actualizarCamposProducto() {
    const producto = document.getElementById("producto").value;
    const esOffice = producto === "Office 365";

    document.getElementById("grupoContrasena").classList.toggle("d-none", !esOffice);
    document.getElementById("grupoDuracion").classList.toggle("d-none", esOffice);

    document.getElementById("labelCorreo").textContent = esOffice
        ? "Correo electrónico generado"
        : "Correo electrónico activado (el que indique el cliente)";

    actualizarFechaExpiracion();
}

// Calcula la fecha de expiración según el producto:
// Office 365 -> +1 año exacto desde el día de la transacción
// Canva -> día de la transacción + duración elegida (en meses)
function actualizarFechaExpiracion() {
    const dia = document.getElementById("diaTransaccion").value;
    const producto = document.getElementById("producto").value;
    const previsualizacion = document.getElementById("previsualizacionExpiracion");

    if (!dia) {
        previsualizacion.textContent = "Selecciona el día de la transacción";
        fechaExpiracionCalculada = "";
        return;
    }

    const [anio, mes, diaNum] = dia.split("-").map(Number);
    const fechaExpira = new Date(anio, mes - 1, diaNum);

    if (producto === "Office 365") {
        fechaExpira.setFullYear(fechaExpira.getFullYear() + 1);
    } else {
        const meses = Number(document.getElementById("duracion").value || 1);
        fechaExpira.setMonth(fechaExpira.getMonth() + meses);
    }

    previsualizacion.textContent = fechaExpira.toLocaleDateString("es-MX", {
        day: "numeric",
        month: "long",
        year: "numeric"
    });

    const yyyy = fechaExpira.getFullYear();
    const mm = String(fechaExpira.getMonth() + 1).padStart(2, "0");
    const dd = String(fechaExpira.getDate()).padStart(2, "0");
    fechaExpiracionCalculada = `${yyyy}-${mm}-${dd}`;
}

function generarURL() {
    const producto = document.getElementById("producto").value;
    const esOffice = producto === "Office 365";
    const dia = document.getElementById("diaTransaccion").value;

    if (!dia) {
        alert("Selecciona el día de la transacción antes de generar el enlace.");
        return;
    }

    const datos = {
        producto: producto,
        correo: document.getElementById("correo").value,
        telefonoCliente: document.getElementById("telefonoCliente").value,
        numeroPedido: document.getElementById("numeroPedido").value,
        monto: document.getElementById("monto").value,
        diaTransaccion: dia,
        horaTransaccion: obtenerHoraCDMX(),
        fechaExpiracion: fechaExpiracionCalculada,
        lugar: document.getElementById("lugar").value
    };

    if (esOffice) {
        datos.contrasena = document.getElementById("contrasena").value;
        datos.duracionMeses = "12";
    } else {
        datos.duracionMeses = document.getElementById("duracion").value;
    }

    const codigo = encodeData(datos);
    const url = new URL("comprobante.html", window.location.href);
    url.searchParams.set("d", codigo);
    urlGenerada = url.href;

    const resultado = document.getElementById("resultado");
    resultado.textContent = urlGenerada;
    resultado.classList.remove("d-none");

    document.getElementById("botonCopiar").classList.remove("d-none");
}

async function copiarURL() {
    await navigator.clipboard.writeText(urlGenerada);
    const boton = document.getElementById("botonCopiar");
    const textoOriginal = boton.textContent;
    boton.textContent = "✓ Enlace copiado";
    setTimeout(() => { boton.textContent = textoOriginal; }, 1500);
}

// Estado inicial: Office 365 seleccionado y fecha de hoy (CDMX) precargada
document.getElementById("diaTransaccion").value = obtenerFechaHoyCDMX();
actualizarCamposProducto();

</script>

</body>
</html>
